<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academy Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #090909;
      color: #fff;
    }

    header {
      background: #111;
      border-bottom: 1px solid #d4a900;
      padding: 20px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    header h1 {
      color: #facc15;
      font-size: 23px;
    }

    button, select {
      cursor: pointer;
      border: none;
      border-radius: 7px;
      padding: 10px 14px;
      font-weight: bold;
    }

    .logout {
      background: #facc15;
      color: #000;
    }

    main {
      max-width: 1200px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h2 {
      color: #facc15;
      margin-bottom: 8px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .card {
      background: #171717;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 22px;
    }

    .card p {
      color: #aaa;
      margin-bottom: 12px;
    }

    .card h3 {
      color: #facc15;
      font-size: 30px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .toolbar input,
    .toolbar select {
      background: #171717;
      border: 1px solid #444;
      color: #fff;
      padding: 12px;
      border-radius: 7px;
    }

    .toolbar input {
      flex: 1;
      min-width: 200px;
    }

    .table-wrap {
      overflow-x: auto;
      background: #171717;
      border: 1px solid #333;
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 750px;
    }

    th, td {
      padding: 16px;
      text-align: left;
      border-bottom: 1px solid #333;
    }

    th {
      color: #facc15;
      background: #202020;
    }

    td {
      color: #ddd;
    }

    .status {
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .Pending {
      background: #594600;
      color: #ffe58a;
    }

    .Approved {
      background: #164b2c;
      color: #8af0ad;
    }

    .Rejected {
      background: #581b1b;
      color: #ffaaaa;
    }

    .action-btn {
      background: #facc15;
      color: #000;
      margin: 3px;
    }

    .delete-btn {
      background: #a32626;
      color: white;
      margin: 3px;
    }

    #message {
      color: #facc15;
      margin: 15px 0;
    }

    @media (max-width: 600px) {
      header {
        padding: 16px;
      }

      header h1 {
        font-size: 17px;
      }

      main {
        margin-top: 25px;
      }
    }
    #detailsModal {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(0, 0, 0, 0.85);
  padding: 20px;
  overflow-y: auto;
}

.modal-content {
  max-width: 750px;
  margin: 40px auto;
  background: #171717;
  border: 1px solid #facc15;
  border-radius: 15px;
  padding: 25px;
  color: white;
}

.modal-content h2 {
  color: #facc15;
  margin: 20px 0;
}
  </style>

</head>

<body>

  <header>
    <h1>Kamal Shuttler Academy</h1>
    <button class="logout" onclick="logout()">Logout</button>
  </header>

  <main>
    <div class="welcome">
      <h2>Admin Dashboard</h2>
      <p>Manage academy website submissions from one place.</p>
    </div>

    <section class="stats">
      <div class="card">
        <p>Total Submissions</p>
        <h3 id="total">0</h3>
      </div>

      <div class="card">
        <p>Pending</p>
        <h3 id="pending">0</h3>
      </div>

      <div class="card">
        <p>Approved</p>
        <h3 id="approved">0</h3>
      </div>

      <div class="card">
        <p>Rejected</p>
        <h3 id="rejected">0</h3>
      </div>
    </section>

    <div class="toolbar">
      <input
        type="search"
        id="search"
        placeholder="Search submissions..."
        oninput="renderTable()"
      />

      <select id="statusFilter" onchange="renderTable()">
        <option value="All">All Status</option>
        <option value="Pending">Pending</option>
        <option value="Approved">Approved</option>
        <option value="Rejected">Rejected</option>
      </select>

      <button class="logout" onclick="loadSubmissions()">
        Refresh
      </button>
    </div>

    <p id="message">Loading submissions...</p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Form Type</th>
            <th>Name</th>
            <th>Email</th>
            <th>Date</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="submissionTable">
          <tr>
            <td colspan="6">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
<div id="detailsModal" style="display:none;">
  <div class="modal-content">
    <button onclick="closeDetails()">✕ Close</button>
    <h2>Applicant Details</h2>
    <div id="detailsContent"></div>
  </div>
</div>
  <script>
    let submissions = [];

    async function checkLogin() {
      try {
        const response = await fetch(
          "/.netlify/functions/admin-auth",
          {
            method: "POST",
            credentials: "same-origin",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ action: "verify" })
          }
        );

        const result = await response.json();

        if (!result.success) {
          window.location.href = "/admin/";
          return;
        }

        loadSubmissions();

      } catch (error) {
        window.location.href = "/admin/";
      }
    }

    async function loadSubmissions() {
      const message = document.getElementById("message");
      message.textContent = "Loading submissions...";

      try {
        const response = await fetch(
          "/.netlify/functions/admin-submissions",
          {
            credentials: "same-origin"
          }
        );

        const result = await response.json();

        if (response.status === 401) {
          window.location.href = "/admin/";
          return;
        }

        if (!result.success) {
          throw new Error(result.message || "Unable to load data");
        }

        submissions = result.submissions || [];

        updateStats();
        renderTable();

        message.textContent = submissions.length
          ? "Submissions loaded successfully."
          : "No submissions found yet.";

      } catch (error) {
        message.textContent = error.message;
      }
    }

    function updateStats() {
      document.getElementById("total").textContent =
        submissions.length;

      document.getElementById("pending").textContent =
        submissions.filter(item => item.status === "Pending").length;

      document.getElementById("approved").textContent =
        submissions.filter(item => item.status === "Approved").length;

      document.getElementById("rejected").textContent =
        submissions.filter(item => item.status === "Rejected").length;
    }

    function renderTable() {
      const table = document.getElementById("submissionTable");
      const search = document.getElementById("search")
        .value.toLowerCase();

      const filter = document.getElementById("statusFilter").value;

      const filtered = submissions.filter(item => {
        const data = item.data || {};

        const name = String(
          data.name || data.fullName || data.customerName || ""
        ).toLowerCase();

        const email = String(data.email || "").toLowerCase();

        const type = String(item.form_type || "").toLowerCase();

        const matchesSearch =
          name.includes(search) ||
          email.includes(search) ||
          type.includes(search);

        const matchesStatus =
          filter === "All" || item.status === filter;

        return matchesSearch && matchesStatus;
      });

      if (!filtered.length) {
        table.innerHTML =
          '<tr><td colspan="6">No matching submissions.</td></tr>';
        return;
      }

      table.innerHTML = filtered.map(item => {
        const data = item.data || {};

       const name =
  data["Full Name"] ||
  data.name ||
  data.fullName ||
  data.customerName ||
  "N/A";

const email =
  data.Email ||
  data["Email Address"] ||
  data.email ||
  "N/A";

        const date = item.submittedAt
          ? new Date(item.submittedAt).toLocaleString()
          : "N/A";

        const status = item.status || "Pending";

        return `
          <tr>
            <td>${escapeHTML(item.form_type || "N/A")}</td>
            <td>${escapeHTML(name)}</td>
            <td>${escapeHTML(email)}</td>
            <td>${escapeHTML(date)}</td>
            <td>
              <span class="status ${status}">
                ${escapeHTML(status)}
              </span>
            </td>
            <td>
                <button class="action-btn"
  onclick="viewDetails('${escapeHTML(item.id)}')">
  View Details
</button>
              <button class="action-btn"
                onclick="updateStatus('${escapeHTML(item.id)}','Approved')">
                Approve
              </button>

              <button class="action-btn"
                onclick="updateStatus('${escapeHTML(item.id)}','Rejected')">
                Reject
              </button>

              <button class="delete-btn"
                onclick="deleteSubmission('${escapeHTML(item.id)}')">
                Delete
              </button>
            </td>
          </tr>
        `;
      }).join("");
    }
function viewDetails(id) {
  const item = submissions.find(sub => sub.id === id);

  if (!item) {
    alert("Submission not found.");
    return;
  }

  const data = item.data || {};
  let html = "";

  for (const [key, value] of Object.entries(data)) {
    if (value === null || value === undefined || value === "") continue;

    const displayValue =
      typeof value === "object"
        ? JSON.stringify(value, null, 2)
        : String(value);

    html += `
      <div style="margin-bottom:15px;">
        <strong style="color:#facc15;">
          ${escapeHTML(key)}
        </strong>
        <p style="white-space:pre-wrap; overflow-wrap:anywhere;">
          ${escapeHTML(displayValue)}
        </p>
      </div>
    `;
  }

  if (item.attachments && item.attachments.length) {
  html += `<h3 style="color:#facc15;">Uploaded Files</h3>`;

  item.attachments.forEach(file => {
    const downloadUrl =
      `/.netlify/functions/admin-file?id=${encodeURIComponent(item.id)}&key=${encodeURIComponent(file.key)}`;

    html += `
      <div style="margin-bottom:15px; padding:12px; background:#262626; border-radius:8px;">
        <p>
          📎 ${escapeHTML(file.fileName || "Attachment")}
          (${escapeHTML(file.contentType || "File")})
        </p>

        <a href="${downloadUrl}"
           style="display:inline-block; margin-top:8px; padding:8px 15px; background:#facc15; color:#000; border-radius:6px; text-decoration:none; font-weight:bold;">
          Download File
        </a>
      </div>
    `;
  });
}
  document.getElementById("detailsContent").innerHTML =
    html || "No details available.";

  document.getElementById("detailsModal").style.display = "block";
}

function closeDetails() {
  document.getElementById("detailsModal").style.display = "none";
}
    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[character]);
    }

    async function updateStatus(id, status) {
      if (!confirm(`Change status to ${status}?`)) return;

      try {
        const response = await fetch(
          "/.netlify/functions/admin-submissions",
          {
            method: "POST",
            credentials: "same-origin",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ id, status })
          }
        );

        const result = await response.json();

        if (!result.success) {
          throw new Error(result.message || "Status update failed");
        }

        await loadSubmissions();

      } catch (error) {
        alert(error.message);
      }
    }

    async function deleteSubmission(id) {
      if (!confirm("Are you sure you want to delete this submission?")) {
        return;
      }

      try {
        const response = await fetch(
          "/.netlify/functions/admin-submissions",
          {
            method: "DELETE",
            credentials: "same-origin",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ id })
          }
        );

        const result = await response.json();

        if (!result.success) {
          throw new Error(result.message || "Delete failed");
        }

        await loadSubmissions();

      } catch (error) {
        alert(error.message);
      }
    }

    async function logout() {
      await fetch("/.netlify/functions/admin-auth", {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ action: "logout" })
      });

      window.location.href = "/admin/";
    }

    checkLogin();
  </script>

</body>
</html>
